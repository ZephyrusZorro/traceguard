[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceguard"
version = "1.0.0"
description = "Causal Multi-Agent Failure Attribution, Prompt-Injection Capability Firewall & Counterfactual Replay Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "scikit-learn>=1.5.0,<2.0",
    "numpy>=1.26.0,<3.0",
    "networkx>=3.3,<4.0",
    "joblib>=1.4.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "websockets>=13.0,<16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
mcp = [
    "mcp>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["traceguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest_tmp"
