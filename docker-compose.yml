services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - TRACEGUARD_HOST=0.0.0.0
      - TRACEGUARD_PORT=8000
    volumes:
      - traceguard_data:/app/data
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  traceguard_data:
